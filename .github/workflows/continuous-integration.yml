name: Continuous Integration
on: [push, pull_request, workflow_dispatch]

jobs:
  CI:
    name: "Build (CPU)"
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        cxx-compiler: [gcc]
    env: 
      CC:  ${{ matrix.cxx-compiler }}
      CXX: ${{ matrix.cxx-compiler }}
      RRTMGP_ROOT: ${{ github.workspace }}
      RRTMGP_DATA: ${{ github.workspace }}/rrtmgp-data
  
    steps:
    #
    # Checks-out repository under $GITHUB_WORKSPACE
    #
    - uses: actions/checkout@v6
      with:
        submodules: recursive
    #
    # Synchronize the package index
    #
    - name: Synchronize the package index
      run: sudo apt-get update
 
    - name: Install dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y gfortran libnetcdf-dev cmake libboost-dev python3-pip python3-setuptools nco
        sudo apt-get install ${{ matrix.cxx-compiler }}
        pip3 install --user numpy netcdf4 dask[array] xarray

    - name: Build
      run: |
        mkdir build
        cd build
        cmake -DSYST=ubuntu_22lts ..
        cmake --build .

    - name: Stage test data
      run: |
        cd rfmip
        ./make_links.sh
        ln -sf ../build/test_rte_rrtmgp .
        cd ../allsky
        ./make_links.sh
        ln -sf ../build/test_rte_rrtmgp .

    - name: Run tests
      run: |
        cd build
        ctest --output-on-failure

  build-cuda:
    name: Build (CUDA)
    runs-on: ubuntu-22.04
    # Official NVIDIA devel image: ships nvcc plus the CUDA math libraries
    # (cuRAND etc.) needed to link, without the slow toolkit install a bare
    # runner would need. No GPU is required to compile -- this job only
    # builds, it does not run the test suite.
    container: nvidia/cuda:12.4.1-devel-ubuntu22.04

    steps:
    # actions/checkout needs git >= 2.18 on PATH to do a real clone; without
    # it, it silently falls back to downloading a tarball via the GitHub
    # REST API, which doesn't support the submodules input at all. The
    # nvidia/cuda image has no git, so install it before checking out.
    - name: Install git
      run: |
        apt-get update -qq
        apt-get install -y --no-install-recommends git ca-certificates

    - uses: actions/checkout@v6
      with:
        submodules: recursive

    # actions/checkout (running as the runner's user) and the rest of the
    # steps (running as this container's default user) disagree on who
    # owns the checked-out files, which git treats as a security risk by
    # default and refuses to touch. Only affects the "git describe" call
    # CMakeLists.txt makes for the build's version string -- harmless
    # either way since that call already falls back to "not available" on
    # failure -- but this gets a real one instead.
    - name: Mark the workspace as a safe git directory
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Install dependencies
      run: |
        apt-get update -qq
        apt-get install -y --no-install-recommends gcc g++ gfortran libnetcdf-dev cmake libboost-dev python3

    - name: Configure
      run: |
        mkdir build
        cd build
        cmake -DSYST=ubuntu_22lts -DRTE_USE_CUDA=ON ..

    - name: Build
      run: |
        cd build
        cmake --build .

  build-kmm-cuda:
    name: Build (KMM + CUDA)
    runs-on: ubuntu-22.04
    # Same rationale as build-cuda above: this only needs to compile, not
    # run, so the devel image (with nvcc and the CUDA math libs KMM links
    # against) is enough without a GPU on the runner.
    container: nvidia/cuda:12.4.1-devel-ubuntu22.04

    steps:
    # See build-cuda above: actions/checkout needs git >= 2.18 on PATH for a
    # real clone (the nvidia/cuda image has none), and the submodules input
    # needs it too -- KMM itself vendors nested submodules (fmt, spdlog,
    # Catch2) that "submodules: recursive" below also has to pull in.
    - name: Install git
      run: |
        apt-get update -qq
        apt-get install -y --no-install-recommends git ca-certificates

    - uses: actions/checkout@v6
      with:
        submodules: recursive

    # See build-cuda above for why this is needed.
    - name: Mark the workspace as a safe git directory
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Install dependencies
      run: |
        apt-get update -qq
        apt-get install -y --no-install-recommends gcc g++ gfortran libnetcdf-dev cmake libboost-dev python3

    - name: Configure
      run: |
        mkdir build
        cd build
        cmake -DSYST=ubuntu_22lts -DRTE_USE_CUDA=ON -DRTE_USE_KMM=ON ..

    - name: Build
      run: |
        cd build
        cmake --build .

  build-kmm-hip:
    name: Build (KMM + HIP)
    runs-on: ubuntu-22.04
    # Official ROCm devel image: ships hipcc plus the ROCm libraries. Pin
    # adjustable if a newer ROCm release is preferred. Same rationale as
    # build-cuda/build-kmm-cuda above: compile-only, no GPU needed on the
    # runner.
    container: rocm/dev-ubuntu-22.04:6.2

    steps:
    # See build-cuda above: actions/checkout needs git >= 2.18 on PATH for a
    # real clone, and the submodules input needs it too -- KMM itself
    # vendors nested submodules (fmt, spdlog, Catch2) that "submodules:
    # recursive" below also has to pull in.
    - name: Install git
      run: |
        apt-get update -qq
        apt-get install -y --no-install-recommends git ca-certificates

    - uses: actions/checkout@v6
      with:
        submodules: recursive

    # See build-cuda above for why this is needed.
    - name: Mark the workspace as a safe git directory
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Install dependencies
      run: |
        apt-get update -qq
        apt-get install -y --no-install-recommends gcc g++ gfortran libnetcdf-dev cmake libboost-dev python3 rocblas-dev

    - name: Configure
      run: |
        mkdir build
        cd build
        cmake -DSYST=ubuntu_22lts -DRTE_USE_HIP=ON -DRTE_USE_KMM=ON ..

    - name: Build
      run: |
        cd build
        cmake --build .

